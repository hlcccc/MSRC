name: CI

on:
  push:
    branches: [main, 'codex/plugguard-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The documented quick start, on the interpreters the package claims.
  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Test suite
        run: python -m pytest -q -rs

      # The console script is declared in pyproject.toml. A fresh install must
      # produce a working command -- that is the claim this step exists to check,
      # and it is the one that silently failed in a sibling project.
      - name: The declared console script works
        run: |
          msrc version
          msrc signals
          msrc signals --second-model

      # The whole framework runs on a CPU with no model and no weights. If that
      # ever stops being true, this step is what notices -- and it is also the
      # claim a new deployment relies on to evaluate the framework before
      # committing a GPU to it.
      - name: End-to-end example without a model
        run: python examples/run_stub.py

      # The README states the signal inventory. This asserts it against the code
      # rather than against the prose, so the two cannot drift apart -- including
      # the distinction between the full registry and the eight candidates fixed
      # by the acceptance protocol. Two registry signals need a second model.
      - name: The declared signal inventory holds
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from msrc.signals import ALL_SIGNALS

          external = [s.name for s in ALL_SIGNALS if s.kind == "external"]
          internal = [s.name for s in ALL_SIGNALS if s.kind == "internal"]
          assert len(external) == 7, external
          assert len(internal) == 5, internal
          assert len(ALL_SIGNALS) == 12, [s.name for s in ALL_SIGNALS]

          donor_signals = {"cross_model_agreement", "cross_model_object_support"}
          single = [s.name for s in ALL_SIGNALS if s.name not in donor_signals]
          assert len(single) == 10, single

          from pipeline.factual import SIGNALS
          assert len(SIGNALS) == len(set(SIGNALS)) == 8, SIGNALS
          assert set(SIGNALS) <= {s.name for s in ALL_SIGNALS}, SIGNALS
          print("ok: 12 registered; 7 external, 5 internal; 8 acceptance candidates")
          PY

  # The decision layer must stay importable with NumPy alone: no torch, no
  # fastapi, no model weights. That is what makes the framework evaluable on a
  # laptop, so it is checked rather than assumed.
  numpy-only:
    name: NumPy-only decision layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependency only
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      # A file rather than an inline heredoc, so it can be run by hand and is
      # covered by the test suite. It was inline until this job was found to have
      # failed on every commit since the first: it fitted the pipeline on invented
      # signal names and then scored it, which the pipeline refuses -- correctly,
      # but at scoring time, a long way from the mistake.
      - name: Decision layer imports and scores without the extras
        run: python examples/numpy_only.py

  docs:
    name: documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every relative markdown link resolves
        run: |
          python - <<'PY'
          import pathlib, re, sys

          broken = []
          for path in (p for p in pathlib.Path(".").rglob("*.md") if ".git" not in p.parts):
              text = path.read_text(encoding="utf-8")
              for m in re.finditer(r"\]\(([^)]+)\)", text):
                  target = m.group(1).split("#")[0]
                  if not target or target.startswith(("http", "mailto")):
                      continue
                  if not (path.parent / target).resolve().exists():
                      broken.append(f"{path}: {target}")
          for item in broken:
              print(f"broken link: {item}")
          sys.exit(1 if broken else 0)
          PY
