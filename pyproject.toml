[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msrc"
version = "0.1.0"
description = "Multi-signal risk calibration for multimodal generation: factual-hallucination risk from internal and external model signals. Content-safety risk is a separate question, modelled outside this repository."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "HLC", email = "hlcccc@users.noreply.github.com" }]
keywords = [
    "hallucination-detection",
    "uncertainty-quantification",
    "calibration",
    "vision-language-model",
    "selective-prediction",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
# The model adapters. Kept out of the core install so the decision layer stays
# NumPy-only and testable on a CPU with no weights.
hf = ["torch>=2.1", "transformers>=4.40", "accelerate", "pillow"]
ocr = ["rapidocr-onnxruntime"]
service = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0"]
# The public-benchmark adapters read parquet, and pandas reads parquet only
# through an engine that it does not install. Listing it here rather than leaving
# it implicit: an undeclared dependency surfaces as a confusing error from inside
# pandas, which is how it goes unnoticed until someone tries a clean install.
datasets = ["pandas>=1.5", "pyarrow>=12.0"]
# Labelling a benchmark from its response text. The official CHAIR vocabulary
# singularises with inflect, and a missing singulariser does not fail loudly -- it
# stops matching plurals, so every hallucination count moves while the run still
# looks like it worked. Declared rather than assumed.
chair = ["inflect>=6.0"]
# The vendored TextVQA official answer-normalisation rule. It imports tqdm at
# module scope, so `scripts/evaluate.py --textvqa-label-rule official` cannot even
# be imported without it. Found by running the suite in a clean environment: the
# development machine had tqdm by accident, from an unrelated install.
textvqa = ["tqdm>=4.60"]
test = [
    "pytest>=7.0",
    "pandas>=1.5",
    "pyarrow>=12.0",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "httpx",
    "inflect>=6.0",
    "tqdm>=4.60",
]

[project.scripts]
msrc = "msrc.cli:main"

[tool.setuptools.packages.find]
include = ["msrc*", "evaluation*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -rs"
